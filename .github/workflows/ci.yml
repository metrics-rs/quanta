name: Rust

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Install Rust Nightly
      run: rustup default nightly
    - name: Check Formatting
      run: cargo fmt --all -- --check
  feature-check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Install Rust Stable
      run: rustup default stable
    - name: Install cargo-hack
      run: cargo install cargo-hack
    - name: Check Feature Matrix
      run: cargo hack build --all --all-targets --feature-powerset
  test:
    name: Test ${{ matrix.rust_version }}/${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        rust_version: ['1.70.0', 'stable', 'nightly']
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
    - uses: actions/checkout@v7
    - name: Install Rust ${{ matrix.rust_version }}
      run: rustup default ${{ matrix.rust_version }}
    - name: Run Tests
      run: cargo test --no-default-features --features=prost -- --test-threads=1
  cross-test:
    name: Test ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - aarch64-unknown-linux-gnu
          - armv5te-unknown-linux-gnueabi
          - arm-unknown-linux-gnueabi
          - armv7-unknown-linux-gnueabihf
    steps:
    - uses: actions/checkout@v7
    - name: Ensure Rust up-to-date
      run: rustup default stable
    - name: Install Cross
      run: cargo install cross --git https://github.com/cross-rs/cross
    - name: Run Tests
      run: cross test --target ${{ matrix.target }} --no-default-features --features=prost -- --test-threads=1
  cross-test-mips-mipssel:
    name: Test ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - mips-unknown-linux-gnu
          - mipsel-unknown-linux-gnu
    steps:
    - uses: actions/checkout@v7
    - name: Ensure Rust up-to-date
      run: rustup default nightly
    - name: Install Cross
      run: cargo install cross --git https://github.com/cross-rs/cross
    - name: Run Tests
      run: cross +nightly test --target ${{ matrix.target }} --no-default-features --features=prost -- --test-threads=1
      env:
        RUSTFLAGS: "-C opt-level=1"
  test-wasm-browser:
    name: Test ${{ matrix.rust_version }}/${{ matrix.os }} (wasm32-unknown-unknown)
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        rust_version: ['1.70.0', 'stable', 'nightly']
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
    - uses: actions/checkout@v7
    - name: Install Rust ${{ matrix.rust_version }}
      run: rustup default ${{ matrix.rust_version }}
    - name: Install wasm32-unknown-unknown target
      run: rustup target add wasm32-unknown-unknown
    - name: Install wasm-pack
      run: cargo install wasm-pack
    - name: Run Tests
      run: wasm-pack test --node
  test-wasi:
    name: Test ${{ matrix.rust_version }}/ubuntu (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rust_version: ['1.70.0', 'stable', 'nightly']
        target: [wasm32-wasip1, wasm32-wasip2]
    steps:
    - uses: actions/checkout@v7
    - name: Install Rust ${{ matrix.rust_version }}
      run: rustup default ${{ matrix.rust_version }}
    - name: Install ${{ matrix.target }} target
      run: rustup target add ${{ matrix.target }}
    - name: Install wasmtime
      uses: bytecodealliance/actions/wasmtime/setup@v1
      with:
        version: "47.0.3"
    - name: Run Tests
      env:
        CARGO_TARGET_WASM32_WASIP1_RUNNER: wasmtime
        CARGO_TARGET_WASM32_WASIP2_RUNNER: wasmtime
      run: cargo test --target ${{ matrix.target }}
  check-emscripten:
    name: Check wasm32-unknown-emscripten
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Install Rust Stable
      run: rustup default stable
    - name: Install wasm32-unknown-emscripten target
      run: rustup target add wasm32-unknown-emscripten
    - name: Check Emscripten target
      run: cargo check --target wasm32-unknown-emscripten
  docs:
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -Dwarnings
    steps:
    - uses: actions/checkout@v7
    - name: Install Rust Nightly
      run: rustup default nightly
    - name: Check Docs
      run: cargo doc --all-features --workspace --no-deps
  bench:
    name: Bench ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
    - uses: actions/checkout@v7
    - name: Install Rust Stable
      run: rustup default stable
    - name: Run Benchmarks
      run: cargo bench -- --output-format bencher
